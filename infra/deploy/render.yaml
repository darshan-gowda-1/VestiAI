databases:
  - name: vestiai-db
    plan: free
    databaseName: vestiai_db
    user: vestiai_user

services:
  - type: redis
    name: vestiai-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: vestiai-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: WORKER_AUTO_DISPATCH
        value: "True"
      - key: AUTO_SEED_CATALOG
        value: "True"
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vestiai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vestiai-redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: MODEL_NAME
        value: remote
      - key: REMOTE_INFERENCE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
