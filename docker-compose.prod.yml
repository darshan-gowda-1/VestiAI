services:
  postgres:
    image: postgres:16-alpine
    container_name: vestiai_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vestiai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vestiai_password}
      POSTGRES_DB: ${POSTGRES_DB:-vestiai_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vestiai_user} -d ${POSTGRES_DB:-vestiai_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vestiai_prod_redis
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vestiai_prod_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vestiai_user}:${POSTGRES_PASSWORD:-vestiai_password}@postgres:5432/${POSTGRES_DB:-vestiai_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-vestiai_user}:${POSTGRES_PASSWORD:-vestiai_password}@postgres:5432/${POSTGRES_DB:-vestiai_db}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set in production}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vestiai_prod_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-False}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set in production}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://127.0.0.1"]}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vestiai_user}:${POSTGRES_PASSWORD:-vestiai_password}@postgres:5432/${POSTGRES_DB:-vestiai_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-vestiai_user}:${POSTGRES_PASSWORD:-vestiai_password}@postgres:5432/${POSTGRES_DB:-vestiai_db}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /app/storage_data
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-stub}
      REMOTE_INFERENCE_URL: ${REMOTE_INFERENCE_URL:-}
    volumes:
      - media_prod_data:/app/storage_data
      - ./scripts:/app/scripts:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vestiai_prod_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-False}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set in production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vestiai_user}:${POSTGRES_PASSWORD:-vestiai_password}@postgres:5432/${POSTGRES_DB:-vestiai_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-vestiai_user}:${POSTGRES_PASSWORD:-vestiai_password}@postgres:5432/${POSTGRES_DB:-vestiai_db}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /app/storage_data
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-stub}
      REMOTE_INFERENCE_URL: ${REMOTE_INFERENCE_URL:-}
    volumes:
      - media_prod_data:/app/storage_data
    command: ["python", "-m", "app.workers.tryon_worker"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: vestiai_prod_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_prod_data:
  redis_prod_data:
  media_prod_data:

