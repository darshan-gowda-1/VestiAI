<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VestiAI Side Panel Try-On</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; background: #FBF9F5; color: #191919; }
      .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EAE3DC; padding-bottom: 10px; margin-bottom: 12px; }
      .brand { font-weight: 700; font-size: 17px; }
      .accent { color: #A85A32; }
      .btn { background: #191919; color: #FBF9F5; border: none; border-radius: 999px; padding: 9px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
      .btn-accent { background: #A85A32; color: #fff; width: 100%; }
      .btn-outline { background: #fff; color: #191919; border: 1px solid #EAE3DC; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .box { background: #fff; border: 1px solid #EAE3DC; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
      .muted { font-size: 11px; color: #525252; line-height: 1.45; }
      img.preview { width: 100%; max-height: 240px; object-fit: contain; border-radius: 8px; background: #F4EFEB; }
    </style>
  </head>
  <body>
    <div id="sidepanel-app"></div>
    <script type="module" src="/src/sidepanel/sidepanel.ts"></script>
  </body>
</html>
