<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VestiAI Try-On Extension</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; width: 360px; margin: 0; padding: 14px; background: #FBF9F5; color: #191919; }
      .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EAE3DC; padding-bottom: 10px; margin-bottom: 12px; }
      .brand { font-weight: 700; font-size: 16px; }
      .accent { color: #A85A32; }
      .btn { background: #191919; color: #FBF9F5; border: none; border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
      .btn-accent { background: #A85A32; color: #fff; }
      .btn-outline { background: #fff; color: #191919; border: 1px solid #EAE3DC; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 220px; overflow-y: auto; margin: 10px 0; }
      .card { background: #fff; border: 1px solid #EAE3DC; border-radius: 10px; padding: 6px; cursor: pointer; text-align: center; }
      .card.selected { border-color: #A85A32; box-shadow: 0 0 0 2px rgba(168,90,50,0.2); }
      .card img { width: 100%; height: 96px; object-fit: contain; border-radius: 6px; }
      .muted { font-size: 11px; color: #525252; }
      .status { font-size: 11px; padding: 8px; border-radius: 8px; background: #F4EFEB; margin-top: 8px; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      input { width: 100%; box-sizing: border-box; padding: 7px 10px; border-radius: 8px; border: 1px solid #EAE3DC; font-size: 12px; margin-bottom: 6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
